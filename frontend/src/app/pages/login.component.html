<main
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-[#141414] px-6 py-12"
>
  <div
    aria-hidden="true"
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_75%_35%,rgba(132,204,22,0.2),transparent_38%),radial-gradient(ellipse_at_18%_85%,rgba(220,38,38,0.12),transparent_35%),linear-gradient(135deg,#141414,#080808)]"
  ></div>

  <section
    class="relative w-full max-w-md rounded-2xl border border-white/10 bg-black/70 p-8 shadow-2xl shadow-black/50 backdrop-blur-xl sm:p-10"
  >
    <a class="mb-8 inline-flex items-center gap-2" routerLink="/login" aria-label="Rickflix, inicio">
      <span class="text-2xl font-black tracking-tight text-red-600">RICK</span>
      <span class="text-2xl font-black tracking-tight text-white">&amp;</span>
      <span class="text-2xl font-black tracking-tight text-rick-green">MORTY</span>
    </a>

    <p class="mb-2 text-xs font-bold uppercase tracking-[0.3em] text-rick-green">
      Tu próximo universo te espera
    </p>
    <h1 class="text-3xl font-bold text-white">Inicia sesión</h1>
    <p class="mb-8 mt-2 text-neutral-400">Continúa explorando el multiverso.</p>

    <form class="space-y-5" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block text-sm font-medium text-neutral-200">
        Correo electrónico
        <input
          class="mt-2 w-full rounded-lg border border-white/10 bg-neutral-800/90 px-4 py-3 text-white outline-none transition placeholder:text-neutral-500 focus:border-rick-green focus:ring-2 focus:ring-rick-green/20"
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@correo.com"
        />
      </label>
      <label class="block text-sm font-medium text-neutral-200">
        Contraseña
        <input
          class="mt-2 w-full rounded-lg border border-white/10 bg-neutral-800/90 px-4 py-3 text-white outline-none transition placeholder:text-neutral-500 focus:border-rick-green focus:ring-2 focus:ring-rick-green/20"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
      </label>

      @if (errorMessage) {
        <p class="text-sm text-red-400" role="alert">{{ errorMessage }}</p>
      }

      <button
        class="w-full rounded-lg bg-red-600 px-4 py-3 font-bold text-white transition hover:bg-red-500 focus:outline-none focus:ring-2 focus:ring-red-400 disabled:cursor-not-allowed disabled:opacity-50"
        type="submit"
        [disabled]="form.invalid || loading"
      >
        {{ loading ? 'Ingresando…' : 'Entrar' }}
      </button>
    </form>

    <p class="mt-6 text-xs text-neutral-500">
      Credenciales de prueba: test&#64;rickandmorty.com / 123456
    </p>
  </section>
</main>
